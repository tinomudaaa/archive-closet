<html lang="en">

<head>

                content="Styled fits. Shoppable pieces. Browse this week's looks from Archive Closet." />

        <style>
                *,
                *::before,
                *::after {
                        margin: 0;
                        padding: 0;
                        box-sizing: border-box;
                }

                body {
                        font-family: 'Inter', sans-serif;
                        color: #1A1A1A;
                        background: #FFFFFF;
                        -webkit-font-smoothing: antialiased;
                }

                a {
                        color: inherit;
                        text-decoration: none;
                }

                button {
                        cursor: pointer;
                        background: none;
                        border: none;
                        font-family: inherit;
                        color: inherit;
                }

                img {
                        display: block;
                        max-width: 100%;
                }

                :root {
                        --bg: #FFFFFF;
                        --fg: #1A1A1A;
                        --muted: #666666;
                        --border: #E5E5E5;
                        --surface: #F5F5F5;
                        --accent: #C45B3A;
                }

                /* ── Header ── */
                .site-header {
                        border-bottom: 1px solid var(--border);
                }

                .header-inner {
                        max-width: 1280px;
                        margin: 0 auto;
                        display: flex;
                        align-items: center;
                        justify-content: flex-start;
                        padding: 16px;
                }

                @media (min-width: 768px) {
                        .header-inner {
                                padding: 16px 32px;
                        }
                }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-left: 48px;
        }

        @media (max-width: 767px) {
            .nav-links {
                display: none;
            }
        }

                .nav-links a {
                        font-size: 11px;
                        font-weight: 500;
                        letter-spacing: 0.1em;
                        text-transform: uppercase;
                        color: var(--muted);
                        transition: color 0.2s;
                }

                .nav-links a:hover {
                        color: var(--fg);
                }

                .header-icons {
                        display: flex;
                        align-items: center;
                        gap: 12px;
            margin-left: auto;
                }

                .header-icons a,
                .header-icons button {
                        padding: 4px;
                        color: var(--fg);
                        transition: color 0.2s;
                }

                .header-icons a:hover,
                .header-icons button:hover {
                        color: var(--accent);
                }

                .header-icons svg {
                        width: 18px;
                        height: 18px;
                        stroke-width: 1.5;
                }

                /* ── Page Header ── */
                .page-header {
                        max-width: 1280px;
                        margin: 0 auto;
                        padding: 48px 16px 0;
                }

                @media (min-width: 768px) {
                        .page-header {
                                padding: 64px 32px 0;
                        }
                }

                .page-header h1 {
                        font-size: 32px;
                        line-height: 40px;
                        font-weight: 600;
                        text-transform: uppercase;
                        letter-spacing: 0.05em;
                }

                .page-header p {
                        margin-top: 8px;
                        font-size: 16px;
                        color: var(--muted);
                }

                /* ── Filter Bar ── */
                .filter-bar {
                        max-width: 1280px;
                        margin: 0 auto;
                        padding: 24px 16px;
                        display: flex;
                        gap: 8px;
                        overflow-x: auto;
                        -ms-overflow-style: none;
                        scrollbar-width: none;
                }

                .filter-bar::-webkit-scrollbar {
                        display: none;
                }

                @media (min-width: 768px) {
                        .filter-bar {
                                padding: 32px 32px 24px;
                                flex-wrap: wrap;
                        }
                }

                .filter-pill {
                        flex-shrink: 0;
                        padding: 8px 20px;
                        font-size: 11px;
                        font-weight: 500;
                        letter-spacing: 0.1em;
                        text-transform: uppercase;
                        border: 1px solid var(--border);
                        background: var(--bg);
                        color: var(--fg);
                        transition: all 0.2s;
                        scroll-snap-align: start;
                }

                .filter-pill.active {
                        background: var(--fg);
                        color: var(--bg);
                        border-color: var(--fg);
                }

                .filter-pill:hover:not(.active) {
                        border-color: var(--fg);
                }

                /* ── Outfits Grid ── */
                .outfits-section {
                        max-width: 1280px;
                        margin: 0 auto;
                        padding: 0 16px 64px;
                }

                @media (min-width: 768px) {
                        .outfits-section {
                                padding: 0 32px 80px;
                        }
                }

                .outfits-grid {
                        display: grid;
                        grid-template-columns: 1fr;
                        gap: 16px;
                }

                @media (min-width: 768px) {
                        .outfits-grid {
                                grid-template-columns: 1fr 1fr;
                                gap: 24px;
                        }
                }

                /* ── Outfit Card ── */
                .outfit-card {
                        position: relative;
                        aspect-ratio: 3/4;
                        overflow: hidden;
                        background: var(--surface);
                }

                .outfit-card img {
                        width: 100%;
                        height: 100%;
                        object-fit: cover;
                }

                .outfit-overlay {
                        position: absolute;
                        inset: 0;
                        background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.3) 40%, transparent 70%);
                }

                .outfit-info {
                        position: absolute;
                        bottom: 0;
                        left: 0;
                        right: 0;
                        padding: 24px;
                        display: flex;
                        flex-direction: column;
                        gap: 8px;
                }

                @media (min-width: 768px) {
                        .outfit-info {
                                padding: 32px;
                        }
                }

                .outfit-vibe {
                        font-size: 11px;
                        font-weight: 500;
                        letter-spacing: 0.1em;
                        text-transform: uppercase;
                        color: rgba(255, 255, 255, 0.7);
                }

                .outfit-name {
                        font-size: 20px;
                        line-height: 24px;
                        font-weight: 600;
                        color: #FFFFFF;
                }

                .outfit-items {
                        list-style: none;
                        display: flex;
                        flex-direction: column;
                        gap: 2px;
                }

                .outfit-items li {
                        font-size: 13px;
                        color: rgba(255, 255, 255, 0.8);
                }

                .outfit-items li::before {
                        content: "• ";
                        opacity: 0.6;
                }

                .outfit-more {
                        font-size: 12px;
                        color: rgba(255, 255, 255, 0.5);
                        font-style: italic;
                }

                .outfit-cta {
                        margin-top: 8px;
                        display: inline-block;
                        font-size: 12px;
                        font-weight: 500;
                        letter-spacing: 0.1em;
                        text-transform: uppercase;
                        color: #FFFFFF;
                        text-decoration: underline;
                        text-underline-offset: 3px;
                        transition: opacity 0.2s;
                }

                .outfit-cta:hover {
                        opacity: 0.8;
                }

                /* ── Placeholder card (no image) ── */
                .outfit-placeholder {
                        background: linear-gradient(135deg, var(--fg) 0%, #333 100%);
                }

                /* ── Empty State ── */
                .empty-state {
                        text-align: center;
                        padding: 80px 16px;
                }

                .empty-state p:first-child {
                        font-size: 16px;
                        color: var(--muted);
                }

                .empty-state p:last-child {
                        font-size: 14px;
                        color: var(--muted);
                        margin-top: 8px;
                }

                /* ── Loading Skeleton ── */
                .skeleton-grid {
                        display: grid;
                        grid-template-columns: 1fr;
                        gap: 16px;
                }

                @media (min-width: 768px) {
                        .skeleton-grid {
                                grid-template-columns: 1fr 1fr;
                                gap: 24px;
                        }
                }

                .skeleton-card {
                        aspect-ratio: 3/4;
                        background: var(--surface);
                        animation: pulse 1.5s ease-in-out infinite;
                }

                @keyframes pulse {

                        0%,
                        100% {
                                opacity: 1;
                        }

                        50% {
                                opacity: 0.5;
                        }
                }

                /* ── Footer ── */
                .site-footer { border-top: 1px solid var(--border); }
                .footer-inner { max-width: 1280px; margin: 0 auto; padding: 48px 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; font-size: 12px; color: var(--muted); }
                @media (min-width: 768px) { .footer-inner { grid-template-columns: repeat(4, 1fr); padding: 48px 32px; } }
                .footer-col h4 { font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 16px; color: var(--fg); }
                .footer-col ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
                .footer-col a { color: var(--muted); transition: color 0.2s; }
                .footer-col a:hover { color: var(--accent); }
                .footer-bottom { text-align: center; padding: 24px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
                @media (min-width: 768px) { .footer-bottom { padding: 24px 32px; } }
        
        .header-left {
            display: flex;
            align-items: center;
            padding-left: 32px;
        }

        .header-logo {
            width: 140px;
            height: auto;
            display: block;
            object-fit: contain;
        }

        @media (max-width: 767px) {
            .header-logo {
                width: 120px;
            }
            .header-left {
                padding-left: 16px;
            }
        }
    </style>
</head>

        <script>
        const SUPABASE_URL = 'https://ypdahlqlgumzxjarkyoj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwZGFobHFsZ3VtenhqYXJreW9qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzYyMTgsImV4cCI6MjA5Mzc1MjIxOH0.WeiTB7CinagWcyfXb_BXsZWA0eRpnaDD6_UNr7psyfY';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

                // ══════════════════════════════════════════════
                // ══════════════════════════════════════════════

                let outfits = [];
                let activeVibe = "All";

                async function fetchOutfits() {
                        try {
                                const { data: records, error } = await db
                  .from('outfits')
                  .select('*')
                  .order('created_at', { ascending: false });
                if (error) throw error;
                outfits = (records || []).map(p => ({
                    id: p.id,
                    name: p.name,
                    slug: p.slug,
                    vibe: p.vibe || '',
                    description: p.description || '',
                    items: p.items || '',
                    coverImage: [],
                    coverImageUrl: p.image_url || ''
                }));
                } catch (e) {
                                console.error('Failed to fetch outfits:', e);
                                outfits = [];
                        }
                        renderFilters();
                        renderOutfits();
                }

                const VIBES = ["All", "Soft", "Street", "Going Out"];

                // ══════════════════════════════════════════════
                // HELPERS
                // ══════════════════════════════════════════════


                function getImageUrl(outfit) {
                        if (outfit.coverImageUrl) {
                                return outfit.coverImageUrl;
                        }
                        return '';
                }

                function buildWhatsAppUrl(outfit) {
                        const itemsList = outfit.items || '';
                        const msg = `Hi! I want the '${outfit.name}' look. Items: ${itemsList}. Is everything available?`;
                        return `https://wa.me/263718968489?text=${encodeURIComponent(msg)}`;
                }

                function parseItems(itemsStr) {
                        if (!itemsStr) return [];
                        return itemsStr.split(',').map(s => s.trim()).filter(Boolean);
                }

                // ══════════════════════════════════════════════
                // RENDER FILTERS
                // ══════════════════════════════════════════════
                function renderFilters() {
                        const bar = document.getElementById('filterBar');
                        bar.innerHTML = VIBES.map(v =>
                                `<button class="filter-pill ${v === activeVibe ? 'active' : ''}" onclick="setVibe('${v}')">${v.toUpperCase()}</button>`
                        ).join('');
                }

                function setVibe(vibe) {
                        activeVibe = vibe;
                        renderFilters();
                        renderOutfits();
                }

                // ══════════════════════════════════════════════
                // RENDER OUTFITS
                // ══════════════════════════════════════════════
                function renderOutfits() {
                        const grid = document.getElementById('outfitsGrid');
                        const filtered = activeVibe === 'All' ? outfits : outfits.filter(o => o.vibe === activeVibe);

                        if (filtered.length === 0) {
                                grid.innerHTML = `
          <div class="empty-state">
            <p>No looks this week.</p>
            <p>Check back Sunday for new styled drops.</p>
          </div>`;
                                grid.className = '';
                                return;
                        }

                        grid.className = 'outfits-grid';
                        grid.innerHTML = filtered.map(outfit => {
                                const imgUrl = getImageUrl(outfit);
                                const items = parseItems(outfit.items);
                                const maxVisible = window.innerWidth < 768 ? 3 : 4;
                                const visibleItems = items.slice(0, maxVisible);
                                const extra = items.length - maxVisible;
                                const waUrl = buildWhatsAppUrl(outfit);

                                const imageHtml = imgUrl
                                        ? `<img src="${imgUrl}" alt="${outfit.name}" loading="lazy" />`
                                        : '';

                                const cardClass = imgUrl ? 'outfit-card' : 'outfit-card outfit-placeholder';

                                return `
          <div class="${cardClass}">
            ${imageHtml}
            <div class="outfit-overlay"></div>
            <div class="outfit-info">
              <span class="outfit-vibe">${outfit.vibe || ''}</span>
              <h2 class="outfit-name">${outfit.name}</h2>
              <ul class="outfit-items">
                ${visibleItems.map(item => `<li>${item}</li>`).join('')}
              </ul>
              ${extra > 0 ? `<span class="outfit-more">+${extra} more</span>` : ''}
              <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="outfit-cta">GET THE LOOK &rarr;</a>
            </div>
          </div>`;
                        }).join('');
                }

                // ══════════════════════════════════════════════
                // LOADING SKELETON
                // ══════════════════════════════════════════════
                function showSkeleton() {
                        const grid = document.getElementById('outfitsGrid');
                        grid.className = 'skeleton-grid';
                        grid.innerHTML = Array(4).fill('<div class="skeleton-card"></div>').join('');
                }

                // ══════════════════════════════════════════════
                // INIT
                // ══════════════════════════════════════════════
                showSkeleton();
                fetchOutfits();
                document.getElementById('year').textContent = new Date().getFullYear();
        </script>
